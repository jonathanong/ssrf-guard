version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      oxc:
        patterns: ["oxlint", "oxfmt"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["actions/*"]
